name: Build Firmware

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build All Variants
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install System Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build python3-venv wget tar

    - name: Install ARM Toolchain (14.3.rel1)
      run: |
        wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
        tar -xf arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
        echo "$PWD/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

    - name: Setup Python Environment
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build Loop
      run: |
        source .venv/bin/activate
        mkdir -p dist
        
        presets=("Custom" "Bandscope" "Broadcast" "Basic" "RescueOps" "Game")
        
        for preset in "${presets[@]}"; do
          echo "Building Preset: $preset"
          
          rm -rf build
          cmake -B build/$preset --preset $preset
          cmake --build build/$preset
          
          cp -v build/$preset/*packed.bin dist/
        done

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-binaries
        path: dist/*.bin
        if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-binaries
          path: firmware

      - name: Rename Binaries
        run: |
          VERSION="${{ github.ref_name }}"
          cd firmware
          for file in *.bin; do
            # Rename f4hwn.game.packed.bin -> f4hwn.game.packed.v4.1.bin
            base_name="${file%.bin}"
            mv "$file" "${base_name}.${VERSION}.bin"
          done

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            firmware/*.bin
            ./k5viewer/k5viewer.py
