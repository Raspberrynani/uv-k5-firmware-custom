name: Build Firmware

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build All Variants
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install System Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build python3-venv wget tar

    - name: Install ARM Toolchain (14.3.rel1)
      run: |
        # 1. Download the toolchain
        wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
        
        # 2. Extract it
        tar -xf arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
        
        # 3. Add to GITHUB_PATH so subsequent steps can find 'arm-none-eabi-gcc'
        echo "$PWD/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

    - name: Verify Toolchain Version
      run: arm-none-eabi-gcc --version

    - name: Setup Python Environment
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build Loop
      run: |
        source .venv/bin/activate
        mkdir -p dist
        
        # List of presets to build
        presets=("Custom" "Bandscope" "Broadcast" "Basic" "RescueOps" "Game")
        
        for preset in "${presets[@]}"; do
          echo "---------------------------------------------------"
          echo "Building Preset: $preset"
          echo "---------------------------------------------------"
          
          # 1. PURGE: Completely remove the build directory
          rm -rf build
          
          # 2. CONFIGURE: Generate build files
          cmake -B build/$preset --preset $preset
          
          # 3. BUILD: Compile
          cmake --build build/$preset
          
          # 4. COLLECT: Copy the packed bin to our 'dist' folder
          cp -v build/$preset/*packed.bin dist/
        done

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: all-firmwares
        path: dist/*.bin
        if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: all-firmwares
          path: firmware
          
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: firmware/*.bin
          generate_release_notes: true
